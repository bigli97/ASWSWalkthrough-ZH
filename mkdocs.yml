site_name: 原罪之战中文攻略
site_description: 按任务条件与行动步骤查阅的本地中文攻略
site_author: 原攻略 Chyos · 原站 Aloof Tooth
site_url: https://bigli97.github.io/ASWSWalkthrough-ZH/
use_directory_urls: false
docs_dir: .build/docs
site_dir: dist/site
theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

    - scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
  features:
    - navigation.top
    - navigation.footer
    - toc.integrate
plugins: []
markdown_extensions:
  - toc:
      permalink: false
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - sane_lists
hooks:
  - scripts/hooks.py
extra_css:
  - assets/site.css
  - assets/search.css
extra_javascript:
  - assets/search-exact.js
validation:
  links:
    not_found: warn
    anchors: warn
